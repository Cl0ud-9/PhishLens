# Tool settings only: the project is run from source, not installed.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["phishlens", "predict", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
